<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAAMS</title>
<style>
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f6fa;color:#1d2433}
.box{max-width:420px;margin:30vh auto 0;padding:0 16px;text-align:center;font-size:16px;line-height:1.5}
button{margin-top:12px;padding:10px 18px;font-size:15px;border:0;border-radius:8px;background:#1F3864;color:#fff;cursor:pointer}
</style>
</head>
<body>
<div class="box" id="msg">Opening SAAMS…</div>
<script>
// SAAMS opener (GitHub Pages). Same pattern as POM's opener: it loads the page from the Apps Script web app
// without sending any Google account, so Google's "several signed-in accounts" error cannot happen.
// The page then sends every request to the web app by POST. Security comes from the email-code login.
// A copy of the page is kept in this browser so later visits open at once; a fresh copy is fetched every time,
// and if it is newer the page reloads once to show it.
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzmCTN9K0MpD6ioNmtFjJZhK6lQ6xXSIs9uLvGuDKpls-2bOSLYsAQwrbVHVSlhk20DqQ/exec';   // ends with /exec
  var MARK = 'SAAMS', store = 'saams_page';
  var T = document.title;
  function good(html) { return html && (html.indexOf(MARK) >= 0 || html.indexOf('CBPMS') >= 0) && html.indexOf('<html') >= 0; }
  function prep(html) { return html.split('__SAAMS_EXEC__').join(EXEC).split('__CBPMS_EXEC__').join(EXEC); }
  // Write the page only after this opener has finished loading, or the old text stays on screen.
  function show(html) { setTimeout(function () { document.open(); document.write(prep(html)); document.close(); if (!document.title) document.title = T; }, 0); }
  function fail() {
    document.getElementById('msg').innerHTML = 'The page did not open. Check your internet connection.<br><button onclick="location.reload()">Try again</button>';
  }
  // Google's relay sometimes drops a reply, so try up to 4 times.
  function get(n) {
    return fetch(EXEC + '?raw=1&page=app&t=' + Date.now(), { credentials: 'omit', redirect: 'follow', cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw 0; return r.text(); })
      .then(function (html) { if (!good(html)) throw 0; return html; })
      .catch(function (e) {
        if (n >= 4) throw e;
        return new Promise(function (res) { setTimeout(res, 700 * n); }).then(function () { return get(n + 1); });
      });
  }
  var saved = null;
  try { saved = localStorage.getItem(store); } catch (e) { }
  var started = Date.now();
  var latest = get(1).then(function (html) { try { localStorage.setItem(store, html); } catch (e) { } return html; });
  // When the saved copy is older than the live page, reload once so the new version shows at once
  // (13 Oct 2026). Not if the page has unsaved work, not after the first 20 seconds, at most once a minute.
  function swap(html) {
    if (html === saved || Date.now() - started > 20000) return;
    try { if (window.S && window.S.dirty) return; } catch (e) { }
    var last = 0; try { last = Number(sessionStorage.getItem('saams_swap') || 0); } catch (e) { }
    if (Date.now() - last < 60000) return;
    try { sessionStorage.setItem('saams_swap', String(Date.now())); } catch (e) { }
    location.reload();
  }
  if (good(saved)) { latest.then(swap, function () { }); show(saved); }
  else latest.then(show).catch(fail);
})();
</script>
</body>
</html>
